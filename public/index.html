<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F2A4A">
<meta name="apple-mobile-web-app-title" content="Budget TxM">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Budget Tara x Mattel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Lora:ital,wght@1,500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ocean:#1A6AAE;--red:#D62839;--navy:#0F2A4A;--lb:#E3EEF8;--white:#fff;--line:#D3E1EF;--muted:#4A6280;--tint:#7FB0DB;--soft:#F3F8FC;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--navy);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3,h4,.hd{font-family:"Plus Jakarta Sans",system-ui,sans-serif;margin:0;color:var(--navy)}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ocean)}
.amt{transition:filter .2s}
body.hide-amt .amt{filter:blur(7px)}
small,.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}

/* layout */
.banner{background:var(--navy);color:#fff;text-align:center;font-size:14px;padding:7px 12px}
.banner b{font-weight:700}
.banner.local{background:var(--red)}
.app{background:var(--navy);display:grid;grid-template-columns:264px 1fr;min-height:calc(100vh - 36px)}
.side{background:var(--navy);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px}
.brand img{width:52px;height:52px;border-radius:50%}
.brand .t{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:18px;line-height:1.1}
.brand .t span{font-weight:600;opacity:.65}
.brand .s{font-size:13px;opacity:.8}
.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);color:#fff;text-decoration:none;font-weight:500;position:relative}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:#fff;color:var(--navy);font-weight:700}
.nav.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--red)}
.nav svg{width:20px;height:20px;flex:none}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:12px;border-radius:99px;padding:0 8px;font-weight:700}
.navsec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:14px 12px 4px;font-weight:700}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:var(--r);padding:10px 12px;border:0;color:#fff;text-align:left;width:100%}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:"Plus Jakarta Sans",system-ui,sans-serif;flex:none;color:#fff}
.av.a{background:var(--ocean)}.av.b{background:var(--red)}.av.sm{width:26px;height:26px;font-size:12px}
main{min-width:0;background:#fff}
.top{display:flex;align-items:center;gap:12px;padding:20px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20}
.top .ttl{flex:1;min-width:0}
.top .ttl small{display:block;font-size:14px}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative;flex:none}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.burger{display:none}
.seg{display:inline-flex;background:var(--lb);border-radius:99px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:99px;padding:5px 10px;font:700 13px "Plus Jakarta Sans",system-ui,sans-serif;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.side .seg{background:rgba(255,255,255,.12)}.side .seg button{color:#fff}.side .seg button.on{background:#fff;color:var(--navy)}
.sidetg{display:flex;gap:8px;padding:12px 4px 4px;flex-wrap:wrap}
.mlogo{display:none;width:38px;height:38px;border-radius:50%;flex:none}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1fr) 92px;gap:6px 14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rrow .rn b{font-size:15px;cursor:pointer;display:block}.rrow .rn small{display:block;font-size:13px}
.rrow .rs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.rrow .rs small{font-size:13px}
.rrow .ra{text-align:right}.rrow .ra b{display:block}.rrow .ra small{font-size:12px}
.rrow .rb{text-align:right}
.content{padding:24px 32px 64px;max-width:1400px}

/* ui */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r);padding:10px 16px;font-weight:700;background:var(--ocean);color:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--lb);color:var(--navy)}
.btn.line{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.navy{background:var(--navy)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.lg{padding:12px 20px}
.lnk{background:none;border:0;color:var(--ocean);font-weight:700;padding:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.card.lb{background:var(--lb);border-color:var(--lb)}
.card.ocean{background:var(--ocean);border-color:var(--ocean);color:#fff}
.card.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.card.ocean h2,.card.ocean h3,.card.navy h2,.card.navy h3,.card.ocean .hd,.card.navy .hd{color:#fff}
.card.ocean small,.card.navy small{color:rgba(255,255,255,.82)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h2,.ch h3{flex:1}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.card.ocean .lbl,.card.navy .lbl{color:rgba(255,255,255,.85)}
.big{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:44px;line-height:1.1;letter-spacing:-.02em}
.mid{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:24px;line-height:1.2}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.main-side{grid-template-columns:minmax(0,1fr) 360px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.tabs{display:inline-flex;background:var(--lb);border-radius:var(--r);padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:9px 18px;border-radius:8px;font-weight:700;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--navy)}
.tabs button.on{background:var(--ocean);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:500}
button.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dotc{width:9px;height:9px;border-radius:50%;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--lb);color:var(--navy);white-space:nowrap}
.pill.red{background:var(--red);color:#fff}
.pill.ocean{background:var(--ocean);color:#fff}
.pill.navy{background:var(--navy);color:#fff}
.pill.ok{background:#fff;border:1.5px solid var(--ocean);color:var(--ocean)}
.motif{position:absolute;right:18px;bottom:14px;width:96px;height:96px;opacity:.9;pointer-events:none}
.rel{position:relative;overflow:hidden}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:15px}
.period{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.period .pbox{display:flex;align-items:center;background:var(--lb);border-radius:var(--r)}
.period .pbox button{border:0;background:none;width:38px;height:40px;display:grid;place-items:center}
.period .pbox span{font-weight:700;font-family:"Plus Jakarta Sans",system-ui,sans-serif;min-width:140px;text-align:center;font-size:15px}
.stripe{height:8px;background:repeating-linear-gradient(90deg,var(--navy) 0 14px,#fff 14px 22px);border-radius:4px}

/* tables & lists */
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--line);font-weight:700}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td.num,th.num{text-align:right;white-space:nowrap}
td.num small{display:block}
.tbl{overflow-x:auto}
.li{display:flex;align-items:center;gap:12px;padding:12px;background:var(--lb);border-radius:var(--r);border-left:4px solid var(--ocean)}
.li + .li{margin-top:10px}
.li .grow{flex:1;min-width:0}
.li b{display:block;font-weight:700}
.li small{display:block;font-size:13px}
.bar{height:12px;background:var(--lb);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ocean);border-radius:6px}
.bar i.navy{background:var(--navy)} .bar i.red{background:var(--red)}
.brow{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center;padding:6px 0;font-size:15px}
.brow .num{text-align:right;font-weight:700}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--lb);border-radius:var(--r);padding:12px;min-height:180px}
.kcol.over{outline:2px dashed var(--ocean)}
.kcol h4{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kcard{background:#fff;border-radius:var(--r);padding:12px;margin-bottom:10px;cursor:grab;border:1.5px solid #fff}
.kcard:hover{border-color:var(--ocean)}
.kcard b{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;display:block;margin-bottom:6px;line-height:1.3}
.kcard .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kcard .od{color:var(--red);font-weight:700}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1.5px solid var(--line)}
.cal .dh{font-size:12px;font-weight:700;letter-spacing:.06em;text-align:center;padding:8px 0;color:var(--muted)}
.cal .dc{min-height:104px;border-bottom:1px solid var(--line);padding:6px 4px;cursor:pointer;text-align:center}
.cal .dc:hover{background:var(--soft)}
.cal .dc.sel{background:var(--lb)}
.cal .dn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-weight:700;font-family:"Plus Jakarta Sans"}
.cal .dc.sun .dn{color:var(--red)}
.cal .dc.today .dn{background:var(--ocean);color:#fff}
.cal .dc.out{opacity:.35}
.cev{display:block;font-size:12px;text-align:left;background:var(--lb);border-left:3px solid var(--ocean);border-radius:4px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* berdua */
.polaroid{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;text-align:center}
.polaroid .ph{aspect-ratio:1.25;border-radius:8px;background:var(--navy);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.polaroid .ph img{width:100%;height:100%;object-fit:cover}
.polaroid .cap{font-family:"Lora",Georgia,serif;font-style:italic;font-weight:500;font-size:18px;margin-top:8px}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tlc{background:var(--lb);border-radius:var(--r);padding:12px 14px;border-left:4px solid var(--ocean);cursor:pointer}
.tlc b{display:block;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;line-height:1.3}
.tlc small{font-size:13px}
.qcard{background:var(--navy);color:#fff;border-radius:var(--r);padding:24px;position:relative;overflow:hidden}
.qcats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:56px;padding-right:110px}
.qcats button{border:1.5px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:99px;padding:7px 16px;font-weight:700;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:14px}
.qcats button.on{background:#fff;color:var(--navy);border-color:#fff}
.qtext{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;font-size:30px;line-height:1.25;max-width:880px;margin-bottom:22px}
.qcard .btn.w{background:#fff;color:var(--navy)}
.qcard .btn.o{background:none;border:1.5px solid rgba(255,255,255,.6);color:#fff}
.qcard .btn.oc{background:var(--ocean)}
.quote{font-family:"Lora",Georgia,serif;font-style:italic;font-weight:500;font-size:22px;line-height:1.4}
.jn{padding:12px 0;border-bottom:1px solid var(--line)}
.jn p{margin:4px 0 0;font-family:"Lora",Georgia,serif;font-style:italic;font-size:18px}

/* to-do & links */
.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:var(--r)}
.todo + .todo{margin-top:8px}
.todo.done{opacity:.55}.todo.done .tx{text-decoration:line-through}
.todo .tx{flex:1;min-width:0}
.cbx{width:24px;height:24px;border-radius:6px;border:2px solid var(--ocean);background:#fff;flex:none;display:grid;place-items:center;padding:0}
.cbx.on{background:var(--ocean)}
.cbx svg{width:16px;height:16px;stroke:#fff}
.lcard{display:flex;gap:12px;align-items:center;padding:14px;background:var(--lb);border-radius:var(--r)}
.lcard a{font-weight:700;font-family:"Plus Jakarta Sans",system-ui,sans-serif;text-decoration:none;color:var(--navy);word-break:break-word}
.lcard a:hover{color:var(--ocean)}
.lic{width:40px;height:40px;border-radius:var(--r);background:var(--ocean);display:grid;place-items:center;flex:none}
.lic svg{width:20px;height:20px;stroke:#fff}
input.f,select.f,textarea.f{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;font-size:16px}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--ocean);border-color:var(--ocean)}
textarea.f{min-height:90px;resize:vertical}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,42,74,.55);display:grid;place-items:center;z-index:100;padding:16px}
.md{background:#fff;border-radius:var(--r);width:min(560px,100%);max-height:92vh;overflow:auto;padding:24px}
.md.wide{width:min(820px,100%)}
.md .ch{margin-bottom:18px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--muted)}
.fld .hint{font-size:13px;color:var(--muted);margin-top:4px}
.frow{display:grid;grid-template-columns:110px 1fr 120px;gap:8px}
.mfoot{display:flex;gap:10px;margin-top:20px;align-items:center}
.pop{position:absolute;top:56px;right:0;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);width:320px;padding:10px;z-index:50}
.pop button.it{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px;border-radius:8px;text-align:left;font-weight:500}
.pop button.it:hover{background:var(--lb)}
.pop .ni{padding:10px;border-radius:8px;font-size:14px}
.pop .ni + .ni{border-top:1px solid var(--line)}
.pop svg{width:18px;height:18px}
.drawer-ov{position:fixed;inset:0;background:rgba(15,42,74,.45);z-index:95}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:96;display:flex;flex-direction:column;animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer .dh2{display:flex;align-items:center;gap:12px;padding:22px 22px 14px;border-bottom:1px solid var(--line)}
.drawer .dh2 h2{flex:1}
.drawer .db{padding:16px 22px 28px;overflow:auto}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:14px;min-height:112px}
.qa button:hover{border-color:var(--ocean);background:var(--soft)}
.qa .qi{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:#fff;flex:none}
.qa .qi svg{width:20px;height:20px}
.qa b{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;font-size:15px;line-height:1.25}
.qa small{font-size:13px;line-height:1.35}
.login{position:fixed;inset:0;background:var(--navy);z-index:300;display:grid;place-items:center;padding:20px}
.lgcard{background:#fff;border-radius:var(--r);padding:32px 28px;width:min(420px,100%);text-align:center}
.lgcard img{width:96px;height:96px;border-radius:50%;margin-bottom:10px}
.lgcard form{display:flex;flex-direction:column;gap:10px;margin-top:20px;text-align:left}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:var(--r);z-index:200;font-weight:500}
.comment{background:var(--lb);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;font-size:15px}
.comment .who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:3px}
svg.chart text{font-family:"DM Sans";fill:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;font-size:14px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

@media (max-width:1100px){.main-side{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  body.navopen .side{transform:none}
  body.navopen::after{content:"";position:fixed;inset:0;background:rgba(15,42,74,.5);z-index:80}
  .burger{display:grid}
  .top{padding:14px 16px}.content{padding:18px 16px 60px}
  .g2,.g3{grid-template-columns:1fr}
  .big{font-size:34px}.qtext{font-size:23px}
  .top .hide-m{display:none}
  .brow{grid-template-columns:110px 1fr 90px}
  .frow{grid-template-columns:90px 1fr}
  .frow .rate{grid-column:1/-1}
  .cal .dc{min-height:64px}.cev{font-size:0;height:6px;padding:0;border-left-width:6px}
  .qcats{padding-right:0;margin-bottom:28px}
}
@media (max-width:600px){
  .g4{grid-template-columns:1fr}
  body{font-size:15px}
  .top{gap:8px;padding:10px 12px}
  .top .ttl h1{font-size:17px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .ttl small{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mlogo{display:block}
  .ib{width:38px;height:38px}.ib svg{width:18px;height:18px}
  .top .btn.lg{padding:9px 11px}
  .content{padding:14px 12px 56px}
  .card{padding:16px}
  .grid,.stack{gap:14px}
  h2{font-size:17px} h3{font-size:16px}
  .big{font-size:30px}.mid{font-size:20px}
  .motif{width:60px;height:60px;right:12px;bottom:10px}
  .card.rel > small,.card.rel > .amt{padding-right:64px}
  .pagebar{gap:10px!important;margin-bottom:14px!important}
  .pagebar .sp{display:none}
  .ptabs{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .tabs button{padding:8px 10px;font-size:14px}
  .period{width:100%;display:grid;grid-template-columns:auto 1fr;gap:8px}
  .period .pbox{justify-content:space-between}
  .period .pbox span{min-width:0;font-size:14px}
  .ch{flex-wrap:wrap;gap:8px}
  .ch .btn{padding:8px 12px;font-size:14px}
  .rrow{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .rrow .rn{grid-column:1}.rrow .ra{grid-column:2;grid-row:1}
  .rrow .rs{grid-column:1}.rrow .rb{grid-column:2;grid-row:2}
  .tbl thead{display:none}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .tbl td{border:0;padding:0;font-size:14px}
  .tbl td:first-child{font-weight:700}
  .tbl td.num{grid-column:2;grid-row:1/span 4;align-self:center}
  .tbl td:not(.num):not(:first-child){color:var(--muted);font-size:13px}
  .tbl tfoot td{font-weight:700}
  .brow{grid-template-columns:96px 1fr 64px;font-size:14px}
  .li{padding:10px}
  .qtext{font-size:20px}.qcard{padding:18px}
  .md{padding:18px}
  .kb{grid-template-columns:repeat(4,minmax(240px,82vw))}
}
</style>

const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ds(new Date());
const pd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const L10N = {
  id:{BULAN:['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'], BLN:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'], HARI:['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']},

};
let LANG = (() => { try { return localStorage.getItem('txm-lang') === 'en' ? 'en' : 'id'; } catch { return 'id'; } })();
let CUR  = (() => { try { return localStorage.getItem('txm-cur') === 'USD' ? 'USD' : 'IDR'; } catch { return 'IDR'; } })();
let BULAN = L10N[LANG].BULAN, BLN = L10N[LANG].BLN, HARI = L10N[LANG].HARI;
const EN = () => LANG === 'en';
const rateNow = () => +settings?.usdRate || 16500;
const idrStr = n => 'Rp ' + Math.round(n||0).toLocaleString('id-ID');
const usdStr = n => '$' + (n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
// Tampilan mengikuti toggle mata uang. Nominal utama (fmtIDR) & sekunder (fmtUSD) saling bertukar saat mode $.
const fmtIDR = n => CUR === 'USD' ? usdStr((n||0) / rateNow()) : idrStr(n);
const fmtUSD = n => CUR === 'USD' ? idrStr((n||0) * rateNow()) : usdStr(n);
const fmtShort = n => {
  n = n||0; let sym = '';
  if(CUR === 'USD'){ n = n / rateNow(); sym = '$'; }
  const a = Math.abs(n), s = n<0?'−':'', dec = v => EN() || CUR==='USD' ? v.toFixed(1) : v.toFixed(1).replace('.',',');
  const U = EN() || CUR==='USD' ? ['B','M','K'] : [' M',' jt',' rb'];
  if(a>=1e9) return s+sym+dec(a/1e9)+U[0]; if(a>=1e6) return s+sym+dec(a/1e6)+U[1]; if(a>=1e3) return s+sym+Math.round(a/1e3)+U[2];
  return s+sym+(CUR==='USD' ? a.toFixed(a<10?2:0) : Math.round(a));
};
const fmtDate = s => { if(!s) return ''; const d = pd(s); return `${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDateLong = s => { const d = pd(s); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`; };
const daysTo = s => Math.round((pd(s) - pd(todayStr())) / 864e5);
const relDay = n => EN() ? (n===0 ? 'Today' : n===1 ? 'Tomorrow' : n>1 ? `In ${n} days` : `${-n} day${n===-1?'':'s'} overdue`) : (n===0 ? 'Hari ini' : n===1 ? 'Besok' : n>1 ? `${n} hari lagi` : `Lewat ${-n} hari`);
const sumBy = (arr,k) => arr.reduce((a,b)=>a+(+b[k]||0),0);

const moneyCell = e => CUR==='USD' ? `<span class="amt mono"><b>${usdStr(e.usd)}</b><small>${idrStr(e.idr)}${e.currency==='IDR'&&e.rate?' · input Rp':''}</small></span>` : `<span class="amt mono"><b>${idrStr(e.idr)}</b><small>${usdStr(e.usd)}${e.currency==='USD'?' · input USD':''}</small></span>`;

async function save(col, obj){
  obj = {...obj}; if(!obj.id) obj.id = uid(); obj.updatedAt = Date.now(); if(!obj.createdAt) obj.createdAt = obj.updatedAt;
  const i = S[col].findIndex(x => x.id === obj.id); if(i>=0) S[col][i] = obj; else S[col].push(obj);
  schedule();
  if(mode === 'db'){
    try { const body = JSON.parse(JSON.stringify(obj)); await db.collection(col).doc(obj.id).set(body); }
    catch(e){ handleWriteErr(e); }
  } else if(mode === 'sb'){
    const { error } = await sb.from('docs').upsert({col, id:obj.id, data:JSON.parse(JSON.stringify(obj))});
    if(error) handleWriteErr(error);
  } else localSave();
  return obj;
}
async function removeDoc(col, id){
  S[col] = S[col].filter(x => x.id !== id); schedule();
  if(mode === 'db'){ try { await db.collection(col).doc(id).delete(); } catch(e){ handleWriteErr(e); } }
  else if(mode === 'sb'){ const { error } = await sb.from('docs').delete().match({col, id}); if(error) handleWriteErr(error); }
  else localSave();
}
async function saveSettings(patch){
  settings = {...settings, ...patch}; schedule();
  if(mode === 'db'){ try { await db.doc('app/settings').set(JSON.parse(JSON.stringify(settings))); } catch(e){ handleWriteErr(e); } }
  else if(mode === 'sb'){ const { error } = await sb.from('docs').upsert({col:'app', id:'settings', data:JSON.parse(JSON.stringify(settings))}); if(error) handleWriteErr(error); }
  else localSave();
}

function handleWriteErr(e){
  const c = e && e.code;
  if(mode === 'sb'){ toast(c === '42501' ? 'Akunmu belum punya akses tulis.' : 'Gagal menyimpan: ' + (e.message||'coba lagi')); return; }
  if(c === 'invalid_argument'){ canWrite = false; toast('Kamu hanya bisa melihat. Minta akses Contributor/Editor untuk mengubah data.'); }
  else if(c === 'quota_exceeded') toast('Penyimpanan penuh. Hapus beberapa data lama dulu.');
  else toast('Gagal menyimpan. Coba lagi sebentar.');
  setBanner();
}

const CFG = window.RK_CONFIG || null;
async function init(){
  render();
  if(CFG && CFG.supabaseUrl){ initSupabase(); return; }
  const use = window.claude && typeof window.claude.use === 'function' ? window.claude.use.bind(window.claude) : null;
  if(!use){ goLocal(); return; }
  let dbCap = null;
  try { [dbCap, userCap] = await Promise.all([use('db'), use('user')]); } catch {}
  if(!dbCap){ goLocal(); return; }
  db = dbCap; mode = 'db';
  try { myId = userCap ? await userCap.id() : null; } catch {}
  try { if(userCap && userCap.can){ const w = await userCap.can('data.write'); if(w === false) canWrite = false; } } catch {}
  const timer = setTimeout(()=>{ if(Object.keys(loaded).length < COLS.length) { setBanner('Data belum bisa dijangkau. Cek koneksi; halaman akan menyusul sendiri.'); } }, 10000);
  COLS.forEach(c => {
    db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({...d.data(), id:d.id}));
      if(!snap.metadata.fromCache) loaded[c] = true;
      if(Object.keys(loaded).length >= COLS.length) clearTimeout(timer);
      schedule();
    }, e => { loaded[c] = true; schedule(); });
  });
  db.doc('app/settings').onSnapshot(snap => {
    if(snap.exists) settings = mergeSettings(snap.data());
    loaded.settings = true; schedule(); maybeAskWho();
  }, ()=>{});
  db.doc('app/photo').onSnapshot(snap => { photo = snap.exists ? snap.data().data : null; schedule(); }, ()=>{});
  setBanner();
}

async function initSupabase(){

  const hashErr = /error_description=([^&]+)/.exec(location.hash);

  try { ({ data:{ session } } = await sb.auth.getSession()); } catch {}
  sb.auth.onAuthStateChange((ev, s) => { if(ev === 'SIGNED_IN' && s) startSb(s); if(ev === 'SIGNED_OUT') location.replace(location.pathname); });
  if(session) startSb(session); else showLogin(hashErr ? decodeURIComponent(hashErr[1].replace(/\+/g,' ')) : '');
}
let sbStarted = false;
async function startSb(session){
  if(sbStarted) return; sbStarted = true;
  if(/access_token|error/.test(location.hash)){ history.replaceState(null, '', location.pathname + location.search); ui.page = 'beranda'; }

  memberWho = mem.who;
  await sbLoadAll();
  sb.channel('rk-docs').on('postgres_changes', {event:'*', schema:'public', table:'docs'}, sbChange)
    .subscribe(st => { if(st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') setBanner('Sinkron realtime terputus. Muat ulang halaman bila data pasangan tidak muncul.'); else if(st === 'SUBSCRIBED') setBanner(); });
  setBanner(); schedule();
}
async function sbLoadAll(){
  let rows = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await sb.from('docs').select('col,id,data').order('col').order('id').range(from, from + 999);
    if(error){ toast('Gagal memuat data: ' + error.message); break; }
    rows = rows.concat(data); if(data.length < 1000) break;
  }
  COLS.forEach(c => S[c] = []);
  rows.forEach(sbApply);
}
function sbApply(r){
  if(!r) return;
  if(r.col === 'app'){ if(r.id === 'settings') settings = mergeSettings(r.data); if(r.id === 'photo') photo = (r.data && r.data.data) || null; return; }
  if(!S[r.col]) return;
  const o = {...r.data, id:r.id}, i = S[r.col].findIndex(x => x.id === r.id);
  if(i >= 0) S[r.col][i] = o; else S[r.col].push(o);
}
function sbChange(p){
  if(p.eventType === 'DELETE'){ const o = p.old || {}; if(o.col === 'app' && o.id === 'photo') photo = null; else if(S[o.col]) S[o.col] = S[o.col].filter(x => x.id !== o.id); }
  else sbApply(p.new);
  schedule();
}

/* ============ Domain calcs ============ */
function inPeriod(s, p=ui.period){ if(!s) return false; return p.mode==='bulan' ? s.startsWith(`${p.y}-${pad(p.m)}`) : s.startsWith(`${p.y}`); }
const periodLabel = (p=ui.period) => p.mode==='bulan' ? `${BULAN[p.m-1]} ${p.y}` : `${EN()?'Year':'Tahun'} ${p.y}`;
const curYM = () => todayStr().slice(0,7);
function monthsBack(n, endY, endM){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(endY, endM-1-i, 1); out.push({y:d.getFullYear(), m:d.getMonth()+1, key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`}); } return out; }
const monthSum = (arr, key, k='idr') => sumBy(arr.filter(e => (e.date||'').startsWith(key)), k);
const isPaid = (item, ym) => S.expenses.some(e => e.itemId === item.id && (e.date||'').startsWith(ym));
function itemsSorted(){ return [...S.routineItems].sort((a,b)=> (ROUTINE_GROUPS.indexOf(a.group)-ROUTINE_GROUPS.indexOf(b.group)) || ((a.order??0)-(b.order??0)) || a.name.localeCompare(b.name)); }
function dueDateFor(item, y, m){ const last = new Date(y, m, 0).getDate(); return `${y}-${pad(m)}-${pad(Math.min(item.dueDay, last))}`; }
function upcomingBills(limit=8){
  const t = new Date(); const out = [];
  [0,1].forEach(off => { const d = new Date(t.getFullYear(), t.getMonth()+off, 1); const y=d.getFullYear(), m=d.getMonth()+1, ym=`${y}-${pad(m)}`;
    S.routineItems.filter(i => i.reminder && i.dueDay).forEach(i => { if(isPaid(i, ym)) return; const due = dueDateFor(i,y,m); const n = daysTo(due); if(off===1 && n>31) return; out.push({item:i, due, n, ym}); }); });
  return out.sort((a,b)=>a.n-b.n).slice(0,limit);
}
function savingTotals(){
  const gen = S.savings.filter(s=>!s.pocketId);
  const general = sumBy(gen,'idr'), generalU = sumBy(gen,'usd');
  const all = sumBy(S.savings,'idr'), allU = sumBy(S.savings,'usd');
  const rate = general && generalU ? general/generalU : (settings.usdRate||16500);
  const pockets = [...S.pockets].sort((x,y)=>(x.createdAt||0)-(y.createdAt||0)).map(p => {
    const own = S.savings.filter(s=>s.pocketId===p.id);
    const isNom = p.mode === 'nominal';
    const alloc = isNom ? (+p.nominal||0) : general*(+p.pct||0)/100;
    const pctEff = general ? alloc/general*100 : (isNom ? 0 : (+p.pct||0));
    const ownT = sumBy(own,'idr'), ownU = sumBy(own,'usd');
    return {...p, isNom, alloc, allocU: alloc/rate, pctEff, own:ownT, ownU, bal: alloc+ownT, balU: alloc/rate+ownU};
  });
  const allocSum = pockets.reduce((a,p)=>a+p.alloc,0);
  const pctUsed = general ? allocSum/general*100 : pockets.filter(p=>!p.isNom).reduce((a,p)=>a+(+p.pct||0),0);
  return {general, generalU, all, allU, pockets, allocSum, pctUsed, over: allocSum > general + 0.5, unalloc: general - allocSum};
}
const pocketBadge = pk => pk.isNom ? `Tetap ${fmtShort(pk.alloc)}` : `${+pk.pct||0}%`;
function expandEvent(ev, start, end){ // returns date strings within [start,end]
  if(!ev.date) return [];
  const base = pd(ev.date), out = [], s = pd(start), e = pd(end);
  const rep = ev.repeat || 'none';
  if(rep === 'none'){ if(base>=s && base<=e) out.push(ev.date); return out; }
  if(rep === 'yearly'){ for(let y=s.getFullYear(); y<=e.getFullYear(); y++){ const d = new Date(y, base.getMonth(), base.getDate()); if(d>=s && d<=e && d>=new Date(base.getFullYear(),0,1)) out.push(ds(d)); } return out; }
  const step = rep==='monthly' ? 1 : Math.max(1, +ev.every||1);
  for(let k=0; k<600; k++){ const d = new Date(base.getFullYear(), base.getMonth()+k*step, base.getDate()); if(d>e) break; if(d>=s) out.push(ds(d)); }
  return out;
}
function calItems(start, end){
  const out = [];
  S.events.forEach(ev => { const t = EV_TYPES.find(x=>x.k===ev.type) || EV_TYPES[6]; expandEvent(ev,start,end).forEach(d => out.push({date:d, title:ev.title, kind:ev.type||'lain', color:t.c, label:t.l, ref:{col:'events', id:ev.id}, done:(ev.doneDates||[]).includes(d)})); });
  S.moments.forEach(mo => expandEvent({...mo, repeat:'yearly'},start,end).forEach(d => out.push({date:d, title:'♥ '+mo.title, kind:'love', color:EXTRA_KINDS.love.c, label:'Love Timeline', ref:{col:'moments', id:mo.id}})));
  S.dates.forEach(dn => { if(dn.date && dn.date>=start && dn.date<=end) out.push({date:dn.date, title:'♥ '+(dn.title||'Date night'), kind:'date', color:EXTRA_KINDS.date.c, label:'Date night', ref:{col:'dates', id:dn.id}}); });
  const s = pd(start), e = pd(end);
  for(let d=new Date(s.getFullYear(), s.getMonth(), 1); d<=e; d=new Date(d.getFullYear(), d.getMonth()+1, 1)){
    const y=d.getFullYear(), m=d.getMonth()+1, ym=`${y}-${pad(m)}`;
    S.routineItems.filter(i=>i.reminder && i.dueDay).forEach(i => { const due = dueDateFor(i,y,m); if(due>=start && due<=end) out.push({date:due, title:'Bayar '+i.name, kind:'bill', color:EXTRA_KINDS.bill.c, label:'Tagihan · '+i.group, ref:{bill:i.id, ym}, done:isPaid(i,ym)}); });
  }
  S.projects.forEach(p => { if(p.deadline && p.deadline>=start && p.deadline<=end && p.status!=='done') out.push({date:p.deadline, title:'Deadline: '+p.title, kind:'deadline', color:EXTRA_KINDS.deadline.c, label:'Project bisnis', ref:{col:'projects', id:p.id}}); });
  S.todos.forEach(t => { if(t.date && t.date>=start && t.date<=end) out.push({date:t.date, title:t.text, kind:'todo', color:EXTRA_KINDS.todo.c, label:'To-do', ref:{col:'todos', id:t.id}, done:!!t.done}); });
  return out.sort((a,b)=> a.date.localeCompare(b.date));
}
function notifications(){
  const out = [];
  upcomingBills(20).filter(b=>b.n<=3).forEach(b => out.push({t:`Bayar ${b.item.name}`, s:`${relDay(b.n)} · ${fmtDate(b.due)}`, red:b.n<0, go:'pengeluaran'}));
  const t = todayStr(); const end = ds(new Date(Date.now()+2*864e5));
  calItems(t, end).filter(i => !['bill','todo'].includes(i.kind) && !i.done).forEach(i => out.push({t:i.title, s:`${relDay(daysTo(i.date))} · ${i.label}`, go:'kalender'}));
  S.todos.filter(x => !x.done && x.date && x.date < t).forEach(x => out.push({t:x.text, s:`To-do lewat ${-daysTo(x.date)} hari`, red:true, go:'todo'}));
  return out;
}

let rq = false;
function schedule(){ if(rq) return; rq = true; requestAnimationFrame(()=>{ rq=false; render(); }); }
function render(){
  const ae = document.activeElement; let keep = null;

function barChart(labels, series, h=220){
  const W = 700, H = h, pl=44, pb=28, pt=22, n = labels.length;
  const max = Math.max(1, ...series.flatMap(s=>s.values));
  const nice = (()=>{ const p = Math.pow(10, Math.floor(Math.log10(max))); const f = max/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; })();
  const gw = (W-pl-10)/n, bw = Math.min(22, (gw-12)/series.length);
  let g = '';
  for(let i=0;i<=4;i++){ const y = pt + (H-pt-pb)*(1-i/4); g += `<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#D3E1EF"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${fmtShort(nice*i/4)}</text>`; }
  labels.forEach((l,i) => { const cx = pl + gw*i + gw/2; series.forEach((s,j) => { const v = s.values[i]||0; const bh = (H-pt-pb)*v/nice; const x = cx - (bw*series.length)/2 + j*bw; g += `<rect x="${x+1}" y="${H-pb-bh}" width="${bw-2}" height="${Math.max(bh,v>0?2:0)}" rx="3" fill="${s.color}"><title>${esc(s.name)} ${esc(l)}: ${fmtIDR(v)}</title></rect>`; }); g += `<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
  return `<svg class="chart amt" viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}

  const groups = ROUTINE_GROUPS.map(g => [g, itemsSorted().filter(i=>i.group===g)]).filter(g=>g[1].length);
  const [yy, mm] = ym.split('-').map(Number);
  return `<div class="card" style="margin-bottom:20px"><div class="ch"><h2>Pos rutin &amp; tagihan</h2><button class="btn line" data-act="item">${IC.plus}Pos baru</button></div><small style="display:block;margin:-8px 0 4px">Status bayar: ${BULAN[mm-1]} ${yy}</small>
    ${groups.length ? groups.map(([g, items]) => `<div class="lbl" style="margin:16px 0 4px">${esc(g)}</div>${items.map(i => {
      const spent = rut.filter(e=>e.itemId===i.id); const paid = i.reminder ? isPaid(i, ym) : null; const due = i.dueDay ? dueDateFor(i, yy, mm) : null; const n = due ? daysTo(due) : null;
      return `<div class="rrow"><div class="rn"><b class="hd" data-act="item" data-id="${i.id}">${esc(i.name)}</b>${i.defAmount?`<small>Biasanya ${i.currency==='USD'?fmtUSD(i.defAmount):fmtIDR(i.defAmount)}</small>`:''}</div>
      <div class="rs">${i.reminder && i.dueDay ? `<small>Jatuh tempo tgl ${i.dueDay}</small> ${paid?'<span class="pill ok">Lunas</span>':`<span class="pill ${n<0?'red':n<=3?'ocean':''}">${relDay(n)}</span>`}` : '<small>Tanpa reminder</small>'}</div>
      <div class="ra amt mono"><b>${fmtIDR(sumBy(spent,'idr'))}</b><small>${spent.length} transaksi</small></div>
      <div class="rb"><button class="btn sm ${paid===false?'':'ghost'}" data-act="pay" data-id="${i.id}" ${due?`data-due="${due}"`:''}>${i.reminder?'Bayar':'Catat'}</button></div></div>`; }).join('')}`).join('')
    : `<div class="empty">Belum ada pos rutin.<br><br><button class="btn" data-act="seedroutine">Isi daftar bawaan (${DEFAULT_ROUTINE.length} pos)</button></div>`}
  </div>
  <div class="card"><div class="ch"><h2>Riwayat transaksi rutin · ${periodLabel()}</h2><button class="btn" data-act="quick" data-k="expense-rutin">${IC.plus}Catat</button></div>
    ${txTable(rut.sort((a,b)=>b.date.localeCompare(a.date)),'expenses',['date','item','remark','source'])}</div>`;
}

/* ---- Kalender ---- */
PAGES.kalender = {
  title: () => ['Kalender Kegiatan', 'Ulang tahun, anniversary, les, piknik & servis'],
  render(){
    const c = ui.cal, first = new Date(c.y, c.m-1, 1), startOff = (first.getDay()+6)%7;
    const gs = new Date(c.y, c.m-1, 1-startOff), cells = [];
    const weeks = Math.ceil((startOff + new Date(c.y, c.m, 0).getDate())/7);
    for(let i=0;i<weeks*7;i++) cells.push(new Date(gs.getFullYear(), gs.getMonth(), gs.getDate()+i));
    const items = calItems(ds(cells[0]), ds(cells[cells.length-1])).filter(it => c.filter==='all' || (c.filter==='other' ? !EV_TYPES.some(t=>t.k===it.kind) : it.kind===c.filter));
    const t = todayStr();
    const selItems = items.filter(i=>i.date===c.sel);
    const upcoming = calItems(t, ds(new Date(Date.now()+30*864e5))).filter(i=>!i.done && i.date>t).slice(0,8);
    const chips = [['all','Semua'], ...EV_TYPES.map(e=>[e.k,e.l,e.c]), ['other','Dari fitur lain']];
    return `<div class="grid main-side"><div class="card">
      <div class="row wrap" style="margin-bottom:14px"><button class="ib" data-act="calstep" data-k="-1">${IC.left}</button><h2 style="min-width:190px;text-align:center">${BULAN[c.m-1]} ${c.y}</h2><button class="ib" data-act="calstep" data-k="1">${IC.right}</button><button class="btn ghost sm" data-act="caltoday">Hari ini</button><span class="sp"></span><button class="btn" data-act="event">${IC.plus}Tambah kegiatan</button></div>
      <div class="row wrap" style="margin-bottom:14px;gap:8px">${chips.map(ch=>`<button class="chip ${c.filter===ch[0]?'on':''}" data-act="calfilter" data-k="${ch[0]}">${ch[2]?`<span class="dotc" style="background:${ch[2]}"></span>`:''}${ch[1]}</button>`).join('')}</div>
      <div class="cal">${(EN()?['MON','TUE','WED','THU','FRI','SAT','SUN']:['SEN','SEL','RAB','KAM','JUM','SAB','MIN']).map(d=>`<div class="dh">${d}</div>`).join('')}
      ${cells.map(d => { const k = ds(d), its = items.filter(i=>i.date===k); return `<div class="dc ${d.getMonth()!==c.m-1?'out':''} ${k===t?'today':''} ${k===c.sel?'sel':''} ${d.getDay()===0?'sun':''}" data-act="calsel" data-k="${k}"><span class="dn">${d.getDate()}</span>${its.slice(0,3).map(i=>`<span class="cev" style="border-left-color:${i.color};${i.done?'opacity:.5;text-decoration:line-through':''}">${esc(i.title)}</span>`).join('')}${its.length>3?`<small style="font-size:11px">+${its.length-3} lagi</small>`:''}</div>`; }).join('')}</div>
    </div>
    <div class="stack"><div class="card"><div class="lbl">Hari terpilih${c.sel===t?' · hari ini':''}</div><h2 style="margin:4px 0 14px">${fmtDateLong(c.sel)}</h2>
      ${selItems.length ? selItems.map(calLi).join('') : '<div class="empty">Tidak ada kegiatan.</div>'}
      <button class="lnk" style="margin-top:12px" data-act="event" data-date="${c.sel}">+ Tambah kegiatan di tanggal ini</button>
      <div class="lbl" style="margin:22px 0 10px">Akan datang · 30 hari</div>
      ${upcoming.length ? upcoming.map(calLi).join('') : '<div class="empty">Belum ada yang dijadwalkan.</div>'}
    </div></div></div>`;
  }
};
function calLi(i){
  const n = daysTo(i.date);
  const act = i.ref.col ? `data-act="calref" data-col="${i.ref.col}" data-id="${i.ref.id}" data-date="${i.date}"` : `data-act="pay" data-id="${i.ref.bill}" data-due="${i.date}"`;
  return `<div class="li" style="border-left-color:${i.color};cursor:pointer;${i.done?'opacity:.55':''}" ${act}><div class="grow"><b>${esc(i.title)}</b><small><b style="display:inline;color:${n<0?'var(--red)':'var(--ocean)'}">${relDay(n)}</b> · ${esc(i.label)}${i.done?' · selesai':''}</small></div>${IC.right.replace('<svg','<svg style="width:18px;height:18px"')}</div>`;
}

PAGES.todo = {
  title: () => ['To-do Household', 'Daftar tugas rumah berdua'],
  render(){
    const t = todayStr(), f = ui.todoFilter;
    const open = S.todos.filter(x=>!x.done), done = S.todos.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
    const sec = [['Terlambat', open.filter(x=>x.date && x.date<t)], ['Hari ini', open.filter(x=>x.date===t)], ['Mendatang', open.filter(x=>x.date && x.date>t).sort((a,b)=>a.date.localeCompare(b.date))], ['Tanpa tanggal', open.filter(x=>!x.date)]];
    const row = x => `<div class="todo ${x.done?'done':''}"><button class="cbx ${x.done?'on':''}" data-act="todotoggle" data-id="${x.id}" aria-label="Selesai">${x.done?IC.tick:''}</button><div class="tx"><b style="font-weight:500">${esc(x.text)}</b>${x.date||x.by?`<small style="display:block;${!x.done&&x.date&&x.date<t?'color:var(--red);font-weight:700':''}">${x.date?fmtDateLong(x.date)+' · '+relDay(daysTo(x.date)):''}${x.by?` · ${esc(nameOf(x.by))}`:''}</small>`:''}</div><button class="lnk" data-act="edit" data-col="todos" data-id="${x.id}">Ubah</button></div>`;
    return `<div class="grid main-side"><div class="stack">
      <form class="card lb" data-form="todoadd"><div class="row wrap"><input class="f" id="todo-text" name="text" placeholder="Tulis tugas baru… (misal: bayar iuran RT)" style="flex:3;min-width:200px" required><input class="f" type="date" name="date" style="flex:1;min-width:150px"><button class="btn">${IC.plus}Tambah</button></div></form>
      <div class="tabs"><button class="${f==='aktif'?'on':''}" data-act="todof" data-k="aktif">Aktif (${open.length})</button><button class="${f==='selesai'?'on':''}" data-act="todof" data-k="selesai">Selesai (${done.length})</button></div>
      ${f==='aktif' ? (open.length ? sec.filter(s=>s[1].length).map(s=>`<div><div class="lbl" style="margin-bottom:8px;${s[0]==='Terlambat'?'color:var(--red)':''}">${s[0]}</div>${s[1].map(row).join('')}</div>`).join('') : '<div class="card empty">Semua beres. Baby steps, tapi kita sampai. ✨</div>')
      : (done.length ? done.slice(0,80).map(row).join('') : '<div class="card empty">Belum ada yang selesai.</div>')}
    </div><div class="stack"><div class="card navy rel" style="min-height:200px"><div class="lbl">Progress minggu ini</div><div class="big" style="margin:10px 0">${S.todos.filter(x=>x.done && x.doneAt > Date.now()-7*864e5).length}</div><small>tugas selesai dalam 7 hari terakhir · ${open.length} masih terbuka</small><div class="motif">${MOTIF.ombakW}</div></div></div></div>`;
  }
};

async function handlePhoto(file){
  if(!file) return;
  try {
    const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src = URL.createObjectURL(file); });
    const max = 720, s = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); let q = .82, data = c.toDataURL('image/jpeg', q);
    while(data.length > 230000 && q > .4){ q -= .1; data = c.toDataURL('image/jpeg', q); }
    await savePhoto(data); toast('Foto diperbarui');
  } catch { toast('Foto tidak bisa dibaca.'); }
}

    case 'formdel': if(formCfg?.onDelete){ const md = el.closest('.md'); if(!md.dataset.confirm){ md.dataset.confirm='1'; el.textContent='Yakin hapus?'; break; } await formCfg.onDelete(); closeModal(); } break;
    case 'project': e.stopPropagation(); formProject(id ? S.projects.find(p=>p.id===id) : null, el.dataset.status); break;
    case 'comment': { const inp = $('#cmt-in'), txt = inp?.value.trim(); if(!txt) break; const p = S.projects.find(x=>x.id===id); if(!p) break; const np = {...p, comments:[...(p.comments||[]), {by:who(), text:txt, at:Date.now()}]}; await save('projects', np); formProject(np); break; }
    case 'pay': payItem(id, el.dataset.due); break;
    case 'item': formItem(id ? S.routineItems.find(i=>i.id===id) : null); break;
    case 'seedroutine': for(const it of DEFAULT_ROUTINE){ if(!S.routineItems.some(x=>x.id===it.id)) await save('routineItems', {...it}); } toast('Daftar pos rutin terisi'); break;
    case 'pocket': formPocket(id ? S.pockets.find(p=>p.id===id) : null); break;
    case 'calstep': { const c = ui.cal; c.m += +k; if(c.m<1){c.m=12;c.y--;} if(c.m>12){c.m=1;c.y++;} render(); break; }
    case 'caltoday': { const d = new Date(); ui.cal.y=d.getFullYear(); ui.cal.m=d.getMonth()+1; ui.cal.sel=todayStr(); render(); break; }
    case 'calfilter': ui.cal.filter = k; render(); break;
    case 'calsel': ui.cal.sel = k; render(); break;
    case 'event': formEvent(null, el.dataset.date); break;
    case 'calref': { const col = el.dataset.col, rec = S[col].find(x=>x.id===id); if(!rec) break; ({events:()=>formEvent(rec), moments:()=>formMoment(rec), dates:()=>formDate(rec), projects:()=>formProject(rec), todos:()=>formTodo(rec)})[col]?.(); break; }
    case 'todof': ui.todoFilter = k; render(); break;
    case 'todotoggle': { const t = S.todos.find(x=>x.id===id); if(t) await save('todos', {...t, done:!t.done, doneAt: !t.done ? Date.now() : null}); break; }
    case 'linkedit': formLink(id ? S.links.find(l=>l.id===id) : null); break;
    case 'moment': formMoment(id ? S.moments.find(m=>m.id===id) : null); break;
    case 'datenight': formDate(id ? S.dates.find(d=>d.id===id) : null); break;
    case 'journal': formJournal(id ? S.journal.find(j=>j.id===id) : null); break;
    case 'qcat': ui.qCat = k; ui.qIdx = Math.floor(Math.random()*Q_BANK[k].length); render(); break;
    case 'qnext': { const n = Q_BANK[ui.qCat].length; let ni; do { ni = Math.floor(Math.random()*n); } while(n>1 && ni===ui.qIdx%n); ui.qIdx = ni; render(); break; }
    case 'answer': openAnswer(); break;
    case 'qhist': openHistory(); break;
    case 'delans': await removeDoc('answers', id); openHistory(); break;
    case 'reflect': openReflect(); break;
    case 'ourstory': openStory(); break;
    case 'photo': document.getElementById('photo-in')?.click(); break;
    case 'export': { const o = {settings, exportedAt:new Date().toISOString()}; COLS.forEach(c=>o[c]=S[c]); const txt = JSON.stringify(o); try { await navigator.clipboard.writeText(txt); toast('Cadangan disalin ke clipboard'); } catch { openModal(`<div class="ch"><h2>Cadangan JSON</h2><button class="ib" data-act="close">${IC.x}</button></div><textarea class="f" style="min-height:300px" readonly>${esc(txt)}</textarea><small>Salin manual teks di atas.</small>`, true); } break; }
    case 'import': openModal(`<div class="ch"><h2>Pulihkan dari JSON</h2><button class="ib" data-act="close">${IC.x}</button></div><form data-form="import"><textarea class="f" name="json" style="min-height:240px" placeholder="Tempel cadangan JSON di sini" required></textarea><p class="muted" style="font-size:14px">Data dengan ID yang sama akan ditimpa; data lain tidak dihapus.</p><button class="btn">Pulihkan</button></form>`, true); break;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target; const kind = f.dataset.form; if(!kind) return; e.preventDefault();
  if(kind==='login'){ const email = readForm(f).email.trim().toLowerCase(); const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Mengirim…';
    const { error } = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.origin + location.pathname, shouldCreateUser:true}});
    const m = $('#lg-msg'); btn.disabled = false; btn.textContent = 'Kirim ulang link';
    if(error){ m.style.color = 'var(--red)'; m.textContent = error.message.includes('rate') ? 'Terlalu sering. Tunggu sebentar lalu coba lagi.' : 'Gagal: ' + error.message; }
    else { m.style.color = ''; m.innerHTML = `Link masuk sudah dikirim ke <b>${esc(email)}</b>. Buka email itu di perangkat ini lalu klik linknya.`; }
    return; }
  if(!canWrite){ toast('Mode lihat saja.'); return; }
  if(kind==='generic' && formCfg){ const v = readForm(f); const btn = f.querySelector('[type=submit]'); if(btn) btn.disabled = true; await formCfg.onSave(v); closeModal(); }
  if(kind==='todoadd'){ const v = readForm(f); if(!v.text.trim()) return; await save('todos', {text:v.text.trim(), date:v.date||'', done:false, by:who()}); f.reset(); document.getElementById('todo-text')?.focus(); }
  if(kind==='answer'){ const v = readForm(f); const qs = Q_BANK[ui.qCat]; await save('answers', {question:qs[ui.qIdx%qs.length], cat:ui.qCat, text:v.text.trim(), by:who(), date:todayStr()}); closeModal(); toast('Jawaban tersimpan'); }
  if(kind==='settings'){ const v = readForm(f); const split = s => s.split(',').map(x=>x.trim()).filter(Boolean); await saveSettings({names:{a:v.na.trim()||'Tara', b:v.nb.trim()||'Mattel'}, usdRate:+v.rate||16500, sources:split(v.sources), linkCats:split(v.linkCats)}); toast('Pengaturan tersimpan'); }
  if(kind==='import'){ try { const o = JSON.parse(readForm(f).json); let n = 0; for(const c of COLS){ for(const r of (o[c]||[])){ if(r && r.id){ await save(c, r); n++; } } } if(o.settings) await saveSettings({...o.settings, whoMap:{...(settings.whoMap||{}), ...(o.settings.whoMap||{})}}); closeModal(); toast(`${n} data dipulihkan`); } catch { toast('JSON tidak valid.'); } }
});
document.addEventListener('input', e => { if(e.target.dataset.input==='linkq'){ ui.linkQ = e.target.value; render(); } });
document.addEventListener('change', e => { if(e.target.id==='photo-in') handlePhoto(e.target.files[0]); if(e.target.matches('[data-cur]')){ /* nothing */ } });
document.addEventListener('keydown', e => { if(e.key==='Escape'){ if($('#modal-root').innerHTML) closeModal(); else if(ui.drawer){ ui.drawer=false; render(); } } if(e.key==='Enter' && e.target.id==='cmt-in'){ e.preventDefault(); e.target.closest('.md').querySelector('[data-act="comment"]')?.click(); } });
/* kanban drag & drop */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-drag]'); if(c){ dragId = c.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', dragId); }catch{} } });
document.addEventListener('dragover', e => { const col = e.target.closest?.('[data-drop]'); if(col && dragId){ e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over')); });
document.addEventListener('drop', async e => { const col = e.target.closest?.('[data-drop]'); if(col && dragId){ e.preventDefault(); const p = S.projects.find(x=>x.id===dragId); const st = col.dataset.drop; dragId = null; col.classList.remove('over'); if(p && p.status!==st){ if(!canWrite){ toast('Mode lihat saja.'); return; } await save('projects', {...p, status:st}); } } });

const EN_RULES = [
  [/^(Selamat pagi|Selamat siang|Selamat sore|Selamat malam), (.+)$/, (m,a,b) => `${({'Selamat pagi':'Good morning','Selamat siang':'Good afternoon','Selamat sore':'Good afternoon','Selamat malam':'Good evening'})[a]}, ${b}`],
  [/^Halo, (.+)$/, (m,a) => `Hi, ${a}`],
  [/^Jatuh tempo tgl (\d+)$/, (m,a) => `Due on day ${a}`],
  [/^(\d+) transaksi$/, (m,a) => `${a} transaction${a==='1'?'':'s'}`],
  [/^(\d+) aktif$/, (m,a) => `${a} active`],
  [/^\+(\d+) lagi$/, (m,a) => `+${a} more`],
  [/^([\d.,]+) hari$/, (m,a) => `${a} days`],
  [/^(\d+)% teralokasi$/, (m,a) => `${a}% allocated`],
  [/^(\d+)% dari saving umum$/, (m,a) => `${a}% of general savings`],
  [/^(\d+)% dari target (.+)$/, (m,a,b) => `${a}% of the ${b} target`],
  [/^Alokasi (.+?) \(≈(.+)% dari saving umum\) \+ setoran langsung (.+)$/, (m,a,b,c) => `Allocated ${a} (≈${b}% of general savings) + direct deposits ${c}`],

  [/^Rutin ([^·]+)$/, (m,a) => `Routine ${a}`],
  [/^Lain ([^·]+)$/, (m,a) => `Other ${a}`],
  [/^Setoran periode ini (.+)$/, (m,a) => `Deposited this period ${a}`],
  [/^Setoran (.+):$/, (m,a) => `Deposits ${a}:`],
  [/^Akumulasi tahun (\d+):$/, (m,a) => `${a} total:`],
  [/^Akumulasi (\d+):$/, (m,a) => `${a} total:`],
  [/^Status bayar: (.+)$/, (m,a) => `Payment status: ${a}`],
  [/^Komentar \((\d+)\)$/, (m,a) => `Comments (${a})`],

  [/^Deadline: (.+)$/, (m,a) => `Deadline: ${a}`],

  [/^Hari ini coba: (.+)$/, (m,a) => `Try today: ${trEN(a)}`],

  [/^\. Buka email itu di perangkat ini lalu klik linknya\.$/, () => '. Open that email on this device and tap the link.'],
  [/^(\d+) data dipulihkan$/, (m,a) => `${a} records restored`],

function trEN(s){
  if(EN_DICT[s] != null) return EN_DICT[s];
  for(const [re, fn] of EN_RULES){ const m = s.match(re); if(m) return fn(...m); }
  if(s.startsWith('· ')) return '· ' + trEN(s.slice(2));
  if(s.includes(' · ')){ const parts = s.split(' · '); const t = parts.map(trEN); if(t.some((x,i)=>x!==parts[i])) return t.join(' · '); }
  if(/^"(.+)"$/.test(s)){ const inner = s.slice(1,-1), t = trEN(inner); if(t !== inner) return `"${t}"`; }
  return s;
}
function translateTree(root){
  if(!EN() || !root) return;
  if(root.nodeType === 3){ trNode(root); return; }
  if(root.nodeType !== 1 || root.closest?.('textarea,script,style')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n; while((n = w.nextNode())) nodes.push(n);
  nodes.forEach(trNode);
  const els = root.matches?.('[placeholder],[title],[aria-label]') ? [root] : [];
  root.querySelectorAll?.('[placeholder],[title],[aria-label]').forEach(e => els.push(e));
  els.forEach(e => ['placeholder','title','aria-label'].forEach(a => { const v = e.getAttribute(a); if(v){ const t = trEN(v.trim()); if(t !== v.trim()) e.setAttribute(a, t); } }));
}
function trNode(node){
  const p = node.parentElement; if(!p || p.closest('textarea,script,style')) return;
  const raw = node.nodeValue, t = raw.trim(); if(!t) return;
  const out = trEN(t); if(out !== t) node.nodeValue = raw.replace(t, out);
}
new MutationObserver(muts => { if(!EN()) return; muts.forEach(m => m.addedNodes.forEach(translateTree)); })
  .observe(document.body, {childList:true, subtree:true});
document.documentElement.lang = LANG;
